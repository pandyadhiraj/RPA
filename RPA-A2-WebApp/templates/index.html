<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Healthcare Appointment Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-xl">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">Book Your Appointment</h1>
    <form action="/submit" method="POST" class="space-y-4">
      <input type="text" name="name" placeholder="Full Name" required class="w-full p-3 border border-gray-300 rounded-lg" />
      <input type="email" name="email" placeholder="Email Address" required class="w-full p-3 border border-gray-300 rounded-lg" />
      <input type="tel" name="phone" placeholder="Phone Number" required class="w-full p-3 border border-gray-300 rounded-lg" />
      
      <select name="gender" required class="w-full p-3 border border-gray-300 rounded-lg">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      
      <input type="date" name="date" required class="w-full p-3 border border-gray-300 rounded-lg" />
      <input type="time" name="time" required class="w-full p-3 border border-gray-300 rounded-lg" />
      <textarea name="reason" placeholder="Reason for Visit" required class="w-full p-3 border border-gray-300 rounded-lg"></textarea>
      
      <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition">
        Confirm Appointment
      </button>
    </form>
  </div>
</body>
</html>
